<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sib</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="top-header">
      <h1>🎹 Sib</h1>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <nav>
          <button class="piano-key" data-screen="cancionero">Cancionero</button>
          <button class="piano-key" data-screen="remix">Remix</button>
          <button class="piano-key" data-screen="acordes">Acordes</button>
          <button class="piano-key" data-screen="nueva-cancion">NUEVA CANCIÓN</button>
        </nav>
      </aside>

      <main class="content">
        <section id="screen-cancionero" class="screen-panel hidden">
          <h3>Cancionero</h3>
          <div id="songbook-cards" class="songbook-cards"></div>
        </section>

        <section id="screen-remix" class="screen-panel hidden">
          <h3>Remix</h3>
          <p class="empty-text"></p>
        </section>

        <section id="screen-acordes" class="screen-panel hidden">
          <h3>Acordes</h3>
          <p class="empty-text"></p>
        </section>

        <section id="screen-nueva-cancion" class="screen-panel">
          <section class="new-song-section">
            <h3>Nueva canción</h3>
            <button id="open-song-form" class="emoji-song-button" aria-label="Agregar nueva canción">
              🎵
            </button>
          </section>

          <section id="song-form-wrapper" class="song-form-wrapper hidden">
            <form id="song-form" class="song-form">
              <h3>Agregar canción</h3>
              <label for="song-title">Título de la canción</label>
              <input id="song-title" name="songTitle" type="text" required />

              <label for="song-artist">Cantante o banda</label>
              <input id="song-artist" name="songArtist" type="text" required />

              <label for="song-lyrics">Letra completa</label>
              <textarea id="song-lyrics" name="songLyrics" rows="8" required></textarea>

              <button type="submit" class="submit-song">Guardar canción</button>
            </form>
          </section>
        </section>
      </main>
    </div>

    <script>
      const openSongFormButton = document.getElementById("open-song-form");
      const songFormWrapper = document.getElementById("song-form-wrapper");
      const songForm = document.getElementById("song-form");
      const songbookCards = document.getElementById("songbook-cards");
      const navButtons = document.querySelectorAll(".piano-key");
      const screenPanels = document.querySelectorAll(".screen-panel");
      const chordOptions = ["", "C", "Cm", "D", "Dm", "E", "Em", "F", "Fm", "G", "Gm", "A", "Am", "B", "Bm"];
      const songs = [];

      const tokenizeLyrics = (lyrics) =>
        lyrics.split("\n").map((line, lineIndex) => ({
          lineIndex,
          words: line
            .trim()
            .split(/\s+/)
            .filter(Boolean)
            .map((word, wordIndex) => ({
              wordIndex,
              text: word,
            })),
        }));

      const updateChordAssignment = (song, lineIndex, wordIndex, chord) => {
        const assignmentIndex = song.chordAssignments.findIndex(
          (assignment) => assignment.lineIndex === lineIndex && assignment.wordIndex === wordIndex,
        );

        if (!chord) {
          if (assignmentIndex >= 0) {
            song.chordAssignments.splice(assignmentIndex, 1);
          }
          return;
        }

        if (assignmentIndex >= 0) {
          song.chordAssignments[assignmentIndex].chord = chord;
          return;
        }

        song.chordAssignments.push({ lineIndex, wordIndex, chord });
      };

      const getChordForWord = (song, lineIndex, wordIndex) =>
        song.chordAssignments.find((assignment) => assignment.lineIndex === lineIndex && assignment.wordIndex === wordIndex)?.chord ||
        "";

      const createChordPicker = (song, wordButton) => {
        const picker = document.createElement("div");
        picker.className = "chord-picker";

        const select = document.createElement("select");
        chordOptions.forEach((chordValue) => {
          const option = document.createElement("option");
          option.value = chordValue;
          option.textContent = chordValue || "Sin acorde";
          select.append(option);
        });

        const { lineIndex, wordIndex } = wordButton.dataset;
        select.value = getChordForWord(song, Number(lineIndex), Number(wordIndex));

        const saveButton = document.createElement("button");
        saveButton.type = "button";
        saveButton.textContent = "Guardar";

        const closeButton = document.createElement("button");
        closeButton.type = "button";
        closeButton.textContent = "Cerrar";

        picker.append(select, saveButton, closeButton);
        wordButton.append(picker);

        saveButton.addEventListener("click", () => {
          updateChordAssignment(song, Number(lineIndex), Number(wordIndex), select.value);
          renderSongs();
        });

        closeButton.addEventListener("click", () => {
          picker.remove();
        });
      };

      const createWordElement = (song, lineIndex, word) => {
        const wrapper = document.createElement("span");
        wrapper.className = "word-wrapper";

        const chord = getChordForWord(song, lineIndex, word.wordIndex);
        const chordLabel = document.createElement("span");
        chordLabel.className = "word-chord";
        chordLabel.textContent = chord || "\u00A0";

        const wordButton = document.createElement("button");
        wordButton.type = "button";
        wordButton.className = "word-token";
        wordButton.dataset.lineIndex = String(lineIndex);
        wordButton.dataset.wordIndex = String(word.wordIndex);
        wordButton.textContent = word.text;

        wordButton.addEventListener("click", () => {
          const existingPicker = wrapper.querySelector(".chord-picker");
          if (existingPicker) {
            existingPicker.remove();
            return;
          }

          document.querySelectorAll(".chord-picker").forEach((picker) => picker.remove());
          createChordPicker(song, wordButton);
        });

        wrapper.append(chordLabel, wordButton);
        return wrapper;
      };

      const renderSongs = () => {
        songbookCards.innerHTML = "";

        songs.forEach((song) => {
          const card = document.createElement("article");
          card.className = "song-card";

          const title = document.createElement("h4");
          title.textContent = song.title;
          const artist = document.createElement("p");
          artist.textContent = song.artist;
          card.append(title, artist);

          const lyricsContainer = document.createElement("div");
          lyricsContainer.className = "lyrics-editor";

          song.lyricsTokens.forEach((line) => {
            const lineRow = document.createElement("div");
            lineRow.className = "lyrics-line";
            lineRow.dataset.lineIndex = String(line.lineIndex);

            line.words.forEach((word) => {
              lineRow.append(createWordElement(song, line.lineIndex, word));
            });

            lyricsContainer.append(lineRow);
          });

          card.append(lyricsContainer);
          songbookCards.prepend(card);
        });
      };

      const showScreen = (screenName) => {
        screenPanels.forEach((panel) => {
          const isTarget = panel.id === `screen-${screenName}`;
          panel.classList.toggle("hidden", !isTarget);
        });
      };

      navButtons.forEach((button) => {
        button.addEventListener("click", () => {
          showScreen(button.dataset.screen);
        });
      });

      openSongFormButton.addEventListener("click", () => {
        songFormWrapper.classList.toggle("hidden");
      });

      songForm.addEventListener("submit", (event) => {
        event.preventDefault();

        const title = songForm.songTitle.value.trim();
        const artist = songForm.songArtist.value.trim();
        const lyrics = songForm.songLyrics.value.trim();

        if (!title || !artist || !lyrics) {
          return;
        }

        songs.unshift({
          title,
          artist,
          lyrics,
          lyricsTokens: tokenizeLyrics(lyrics),
          chordAssignments: [],
        });
        renderSongs();

        songForm.reset();
        songFormWrapper.classList.add("hidden");
      });
    </script>
  </body>
</html>
