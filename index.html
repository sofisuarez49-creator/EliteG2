<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sib</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="top-header">
      <h1>🎹 Sib</h1>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <nav>
          <button class="piano-key" data-screen="cancionero">Cancionero</button>
          <button class="piano-key" data-screen="remix">Remix</button>
          <button class="piano-key" data-screen="acordes">Acordes</button>
          <button class="piano-key" data-screen="nueva-cancion">NUEVA CANCIÓN</button>
        </nav>
      </aside>

      <main class="content">
        <section id="screen-cancionero" class="screen-panel hidden">
          <h3>Cancionero</h3>
          <div id="songbook-cards" class="songbook-cards"></div>

          <section id="song-detail" class="song-detail hidden">
            <h4 id="detail-title"></h4>
            <p id="detail-artist" class="detail-artist"></p>

            <div class="chord-picker">
              <label for="chord-search">Buscar acorde</label>
              <input id="chord-search" type="text" placeholder="Ej: F#m7, Bbmaj7, Dsus4" />
              <div id="chord-tags" class="chord-tags"></div>
            </div>

            <p class="detail-help">Selecciona una palabra y luego un acorde para aplicarlo.</p>
            <div id="lyrics-editor" class="lyrics-editor"></div>
          </section>
        </section>

        <section id="screen-remix" class="screen-panel hidden">
          <h3>Remix</h3>
          <p class="empty-text"></p>
        </section>

        <section id="screen-acordes" class="screen-panel hidden">
          <h3>Acordes</h3>
          <p class="empty-text"></p>
        </section>

        <section id="screen-nueva-cancion" class="screen-panel">
          <section class="new-song-section">
            <h3>Nueva canción</h3>
            <button id="open-song-form" class="emoji-song-button" aria-label="Agregar nueva canción">
              🎵
            </button>
          </section>

          <section id="song-form-wrapper" class="song-form-wrapper hidden">
            <form id="song-form" class="song-form">
              <h3>Agregar canción</h3>
              <label for="song-title">Título de la canción</label>
              <input id="song-title" name="songTitle" type="text" required />

              <label for="song-artist">Cantante o banda</label>
              <input id="song-artist" name="songArtist" type="text" required />

              <label for="song-lyrics">Letra completa</label>
              <textarea id="song-lyrics" name="songLyrics" rows="8" required></textarea>

              <button type="submit" class="submit-song">Guardar canción</button>
            </form>
          </section>
        </section>
      </main>
    </div>

    <script>
      const CHORD_CATALOG = Object.freeze({
        bases: ["A", "A#", "Bb", "B", "C", "C#", "Db", "D", "D#", "Eb", "E", "F", "F#", "Gb", "G", "G#", "Ab"],
        variants: ["", "m", "7", "maj7", "m7", "sus2", "sus4", "dim", "aug", "add9", "6", "9"]
      });

      const CHORD_OPTIONS = Object.freeze(
        CHORD_CATALOG.bases.flatMap((base) => CHORD_CATALOG.variants.map((variant) => `${base}${variant}`))
      );

      const openSongFormButton = document.getElementById("open-song-form");
      const songFormWrapper = document.getElementById("song-form-wrapper");
      const songForm = document.getElementById("song-form");
      const songbookCards = document.getElementById("songbook-cards");
      const navButtons = document.querySelectorAll(".piano-key");
      const screenPanels = document.querySelectorAll(".screen-panel");
      const songDetail = document.getElementById("song-detail");
      const detailTitle = document.getElementById("detail-title");
      const detailArtist = document.getElementById("detail-artist");
      const lyricsEditor = document.getElementById("lyrics-editor");
      const chordTags = document.getElementById("chord-tags");
      const chordSearch = document.getElementById("chord-search");

      const songs = [];
      let activeSongId = null;
      let activeWord = null;

      const showScreen = (screenName) => {
        screenPanels.forEach((panel) => {
          const isTarget = panel.id === `screen-${screenName}`;
          panel.classList.toggle("hidden", !isTarget);
        });
      };

      const tokenizeLine = (line) => line.trim().split(/\s+/).filter(Boolean).map((word) => ({ word, chord: null }));

      const renderChordTags = (query = "") => {
        const normalized = query.trim().toLowerCase();
        const filtered = CHORD_OPTIONS.filter((chord) => chord.toLowerCase().includes(normalized)).slice(0, 40);

        chordTags.innerHTML = "";

        filtered.forEach((chord) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "chord-chip";
          button.textContent = chord;
          button.addEventListener("click", () => applyChordToActiveWord(chord));
          chordTags.append(button);
        });
      };

      const renderLyrics = () => {
        const song = songs.find((item) => item.id === activeSongId);
        if (!song) return;

        lyricsEditor.innerHTML = "";

        song.lines.forEach((line, lineIndex) => {
          const row = document.createElement("div");
          row.className = "lyrics-line";

          line.forEach((token, wordIndex) => {
            const tokenEl = document.createElement("button");
            tokenEl.type = "button";
            tokenEl.className = "lyric-token";
            tokenEl.innerHTML = `<span class="token-chord">${token.chord ?? ""}</span><span>${token.word}</span>`;

            const isActive = activeWord && activeWord.lineIndex === lineIndex && activeWord.wordIndex === wordIndex;
            tokenEl.classList.toggle("active", Boolean(isActive));

            tokenEl.addEventListener("click", () => {
              activeWord = { lineIndex, wordIndex };
              renderLyrics();
            });

            row.append(tokenEl);
          });

          lyricsEditor.append(row);
        });
      };

      const openSongDetail = (songId) => {
        activeSongId = songId;
        activeWord = null;

        const song = songs.find((item) => item.id === songId);
        if (!song) return;

        detailTitle.textContent = song.title;
        detailArtist.textContent = song.artist;
        songDetail.classList.remove("hidden");

        renderChordTags(chordSearch.value);
        renderLyrics();
      };

      const applyChordToActiveWord = (chord) => {
        if (!activeWord || activeSongId === null) return;

        const song = songs.find((item) => item.id === activeSongId);
        if (!song) return;

        const token = song.lines[activeWord.lineIndex]?.[activeWord.wordIndex];
        if (!token) return;

        token.chord = chord;
        renderLyrics();
      };

      navButtons.forEach((button) => {
        button.addEventListener("click", () => {
          showScreen(button.dataset.screen);
        });
      });

      openSongFormButton.addEventListener("click", () => {
        songFormWrapper.classList.toggle("hidden");
      });

      chordSearch.addEventListener("input", () => {
        renderChordTags(chordSearch.value);
      });

      songForm.addEventListener("submit", (event) => {
        event.preventDefault();

        const title = songForm.songTitle.value.trim();
        const artist = songForm.songArtist.value.trim();
        const lyrics = songForm.songLyrics.value.trim();

        if (!title || !artist || !lyrics) return;

        const newSong = {
          id: crypto.randomUUID(),
          title,
          artist,
          lines: lyrics.split("\n").filter((line) => line.trim()).map(tokenizeLine)
        };

        songs.unshift(newSong);

        const card = document.createElement("article");
        card.className = "song-card";
        card.innerHTML = `
          <h4>${title}</h4>
          <p>${artist}</p>
        `;
        card.addEventListener("click", () => {
          showScreen("cancionero");
          openSongDetail(newSong.id);
        });

        songbookCards.prepend(card);

        songForm.reset();
        songFormWrapper.classList.add("hidden");
      });

      renderChordTags();
    </script>
  </body>
</html>
